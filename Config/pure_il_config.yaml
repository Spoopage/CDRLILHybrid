behaviors:
  ILAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: constant
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    behavioral_cloning:
      demo_path: "C:/Kuliah/Skripsi/ILDemos/"
      strength: 1.0
      steps: 5000000
    reward_signals:
      extrinsic:
        strength: 0.0
        gamma: 0.99
    max_steps: 5000000  
    keep_checkpoints: 10
    time_horizon: 64
    summary_freq: 10000

engine_settings:
  width: 84
  height: 84
  quality_level: 1
  time_scale: 5
  target_frame_rate: -1
  capture_frame_rate: 60